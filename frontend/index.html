<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Caderno do Alexandre</title>
  <style>
    body { font-family: sans-serif; background: #0f0f0f; color: #fff; text-align: center; padding: 20px; }
    h1 { color: #00ff88; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; max-width: 900px; margin: 20px auto; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; border-left: 4px solid #00ff88; text-align: left; }
    .card h3 { margin: 0 0 10px 0; }
    button { padding: 12px 25px; background: #00ff88; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .status { margin: 15px; color: #aaa; }
  </style>
</head>
<body>
  <h1>🚀 Meu Caderno de Estudos</h1>
  <p class="status" id="status">Backend conectado: Backend do Alexandre funcionando! 🚀</p>
  <button onclick="carregarEstudos()">Carregar Meus Estudos</button>
  
  <div class="grid" id="lista"></div>

  <script>
    async function carregarEstudos() {
      document.getElementById('status').innerText = 'Buscando seus estudos...';
      const res = await fetch('/estudos');
      const estudos = await res.json();
      
      const lista = document.getElementById('lista');
      lista.innerHTML = '';
      
      estudos.forEach(item => {
        lista.innerHTML += `
          <div class="card">
            <h3>${item.materia}</h3>
            <p>${item.horas_estudadas}h estudadas</p>
            <p>Status: ${item.status}</p>
          </div>
        `;
      });
      document.getElementById('status').innerText = `Mostrando ${estudos.length} matérias!`;
    }
  </script>
</body>
</html>
